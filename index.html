<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050d">
<title>VELTRONIX FLOW | Gestão inteligente</title>
<style>
:root{--bg:#07050d;--panel:#120e1dd9;--p2:#1a1427;--bd:#3a2760;--pu:#a855f7;--pl:#c084fc;--tx:#f5f3fa;--mu:#9993aa;--gr:#4ade80;--rd:#fb7185;--r:16px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px Inter,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,select,input{font:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--pl);outline-offset:2px}
[hidden]{display:none!important}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#07050d}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:fl 14s ease-in-out infinite alternate}
.bg i:nth-child(1){width:520px;height:520px;background:#9d30ff;top:-160px;left:12%}
.bg i:nth-child(2){width:460px;height:460px;background:#ff2bd6;bottom:-170px;right:5%;animation-delay:-5s;opacity:.32}
.bg i:nth-child(3){width:380px;height:380px;background:#4b2bff;top:40%;left:55%;animation-delay:-9s;opacity:.32}
.bg:after{content:"";position:absolute;inset:0;background-image:linear-gradient(#a855f718 1px,transparent 1px),linear-gradient(90deg,#a855f718 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%)}
@keyframes fl{to{transform:translate(70px,50px) scale(1.15)}}
@media(prefers-reduced-motion:reduce){.bg i{animation:none}}
.sidebar{width:248px;background:#0b0813e6;backdrop-filter:blur(14px);border-right:1px solid var(--bd);position:fixed;inset:0 auto 0 0;padding:calc(26px + env(safe-area-inset-top,0px)) 16px 20px;display:flex;flex-direction:column;z-index:10;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 26px}
.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;font-weight:900;font-size:19px;background:linear-gradient(135deg,#c26bff,#6926bb);box-shadow:0 0 22px #a855f7aa,0 0 4px #e9b8ff inset}
.bn{font-size:14px;font-weight:800;letter-spacing:1.2px;word-break:break-word}.bs{font-size:10px;color:var(--mu);margin-top:4px;letter-spacing:2px}
.nl{padding:10px 12px;color:#8a82a0;font-size:10px;font-weight:700;letter-spacing:1.5px}
.nav{display:grid;gap:4px}
.nav button{border:1px solid transparent;color:#b3abc6;background:transparent;border-radius:10px;padding:11px 12px;text-align:left;display:flex;align-items:center;gap:12px;transition:.2s}
.nav button:hover{background:var(--p2);color:#fff}
.nav button.active{background:#a855f722;color:var(--pl);border-color:#a855f744;box-shadow:0 0 16px #a855f722}
.ni{width:20px;text-align:center;font-size:17px}
.sb{margin-top:auto;padding-top:20px}
.plan{padding:14px;border:1px solid var(--bd);border-radius:13px;background:linear-gradient(145deg,#1d1330,#100e17)}
.plan p{color:var(--mu);font-size:11px;line-height:1.6;margin:8px 0}
.profile{display:flex;gap:10px;align-items:center;border-top:1px solid var(--bd);padding:16px 4px 0;margin-top:16px}
.avatar{width:36px;height:36px;border-radius:50%;background:#35204b;color:#e9d5ff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.pn{font-weight:600;font-size:12px}.pr{color:var(--mu);font-size:11px;margin-top:3px}
.main{margin-left:248px;padding:28px 34px 40px;max-width:1700px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
.bc{color:var(--mu);font-size:12px}.bc strong{color:var(--tx)}
.ta{display:flex;align-items:center;gap:10px}
.status{display:flex;align-items:center;gap:8px;color:#c3bbd1;font-size:11px;border:1px solid var(--bd);padding:9px 12px;border-radius:9px;background:var(--panel)}
.dot{width:7px;height:7px;background:var(--gr);border-radius:50%;box-shadow:0 0 8px var(--gr)}
