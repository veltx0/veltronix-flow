
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0910">
<title>VELTRONIX FLOW | Gestão inteligente</title>
<style>
:root{
  --bg:#09080e;--panel:#12101b;--panel2:#191625;--border:#2a2439;
  --purple:#a855f7;--purple2:#7928ca;--light:#c084fc;
  --text:#f5f1fc;--muted:#a49ab8;--green:#34d399;--red:#fb7185;
  --yellow:#fbbf24;--radius:16px
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--light);outline-offset:2px}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:#0e0c15;border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:24px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:11px;padding:0 9px}
.brand-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--purple),var(--purple2));display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 0 25px #a855f733}
.brand strong{display:block;font-size:15px;letter-spacing:1px}
.brand small{color:var(--muted);font-size:11px}
.nav-title{color:#756b89;font-size:10px;font-weight:800;letter-spacing:1.5px;padding:0 12px;margin:8px 0}
.nav{display:grid;gap:5px}
.nav button{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:11px;text-align:left;transition:.18s}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.active{background:#a855f719;color:var(--light);border-color:#a855f738}
.nav .ico{width:22px;text-align:center;font-size:17px}
.nav .soon{margin-left:auto;font-size:9px;color:var(--light);border:1px solid #a855f74d;padding:3px 5px;border-radius:5px}
.sidebar-bottom{margin-top:auto;padding:13px;border:1px solid var(--border);border-radius:13px;background:var(--panel)}
.sidebar-bottom small{color:var(--muted)}
.sidebar-bottom strong{display:block;margin:7px 0;font-size:13px}
.main{flex:1;min-width:0}
.topbar{height:76px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:15px;padding:0 30px;background:#0b0911eF;position:sticky;top:0;z-index:5;backdrop-filter:blur(15px)}
.top-left,.top-actions{display:flex;align-items:center;gap:12px}
.page-heading{font-size:19px;font-weight:800}
.page-subtitle{font-size:12px;color:var(--muted);margin-top:4px}
.icon-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:10px;width:40px;height:40px}
.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#a855f726;color:var(--light);font-weight:800}
.menu-toggle{display:none}
.content{padding:28px;max-width:1500px;margin:auto}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
h1,h2,h3,p{margin-top:0}
h1{font-size:25px;margin-bottom:6px}
h2{font-size:18px}
p{line-height:1.55}
.muted{color:var(--muted)}
.small{font-size:12px}
.grid{display:grid;gap:17px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}
.two-col{grid-template-columns:1.2fr .8fr}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;min-width:0}
.stat-label{color:var(--muted);font-size:12px}
.stat-value{font-size:28px;font-weight:850;margin:12px 0 7px;letter-spacing:-1px;overflow-wrap:anywhere}
.stat-foot{font-size:11px;color:var(--muted)}
.stat-icon{float:right;width:39px;height:39px;border-radius:12px;background:#a855f71b;display:grid;place-items:center;font-size:18px}
.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:12px}
.btn:hover{filter:brightness(1.15)}
.btn-primary{background:linear-gradient(135deg,var(--purple),var(--purple2));border-color:transparent;color:white}
.btn-danger{color:var(--red);border-color:#fb718533;background:#fb71850d}
.btn-success{color:var(--green);border-color:#34d39933;background:#34d3990d}
.btn-sm{padding:7px 10px;font-size:11px}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.field{display:grid;gap:7px;margin-bottom:14px}
.field label{font-size:12px;color:var(--muted);font-weight:700}
.input,.select,.textarea{width:100%;background:#0c0a12;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;min-width:0}
.textarea{resize:vertical;min-height:90px}
.input::placeholder,.textarea::placeholder{color:#71677f}
.search{flex:1;min-width:180px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--border);font-size:12px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
td{color:#e9e2f4}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#ffffff04}
.badge{display:inline-flex;padding:5px 8px;border-radius:7px;font-size:10px;font-weight:800;background:#a855f71a;color:var(--light)}
.badge.green{background:#34d39917;color:var(--green)}
.badge.red{background:#fb718517;color:var(--red)}
.badge.yellow{background:#fbbf2417;color:var(--yellow)}
.empty{text-align:center;padding:35px 12px;color:var(--muted);font-size:13px}
.empty-icon{font-size:28px;margin-bottom:10px}
.activity{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.activity:last-child{border:0}
.activity-dot{width:9px;height:9px;border-radius:50%;background:var(--purple);margin-top:5px;flex-shrink:0}
.activity strong{font-size:12px;display:block;margin-bottom:5px}
.activity small{font-size:11px;color:var(--muted)}
.quick-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.quick{padding:16px;text-align:left;min-height:90px;display:block}
.quick span{display:block;font-size:22px;margin-bottom:9px}
.quick strong{font-size:12px}
.bar-row{display:grid;grid-template-columns:100px 1fr 35px;align-items:center;gap:10px;margin:15px 0;font-size:11px}
.bar-track{height:8px;border-radius:20px;background:#ffffff0c;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--purple2),var(--light));border-radius:20px}
.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.check-item{display:flex;align-items:center;gap:9px;background:#0c0a12;border:1px solid var(--border);padding:11px;border-radius:10px;font-size:12px}
.check-item input{accent-color:var(--purple)}
.notice{padding:13px;border-radius:10px;border:1px solid #a855f73b;background:#a855f710;color:#d9b5ff;font-size:12px;line-height:1.5;margin-bottom:15px}
hr{border:0;border-top:1px solid var(--border);margin:20px 0}
.footer{padding:20px 28px;color:#71677f;font-size:11px;text-align:center}
.hidden{display:none!important}
.modal-backdrop{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:18px}
.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 25px 90px #0008}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}
.modal-head h2{margin:0}
.toast-area{position:fixed;right:20px;bottom:20px;z-index:50;display:grid;gap:8px;width:min(350px,calc(100vw - 40px))}
.toast{background:#211a30;border:1px solid #a855f766;padding:13px 16px;border-radius:12px;font-size:12px;box-shadow:0 10px 30px #0007;animation:appear .2s ease}
@keyframes appear{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
.setup-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#38175a55,transparent 55%),var(--bg)}
.setup-card{width:min(780px,100%);background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:clamp(20px,5vw,42px);box-shadow:0 30px 100px #0006}
.setup-brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}
.setup-brand h1{font-size:16px;letter-spacing:1px;margin:0}
.setup-title{font-size:clamp(25px,5vw,36px);letter-spacing:-1px;line-height:1.15;margin-bottom:12px}
.setup-desc{color:var(--muted);font-size:13px;margin-bottom:25px}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:24px}
.choice{display:block;position:relative}
.choice input{position:absolute;opacity:0}
.choice-content{height:100%;border:1px solid var(--border);border-radius:14px;padding:17px;background:#0c0a12;cursor:pointer;transition:.2s}
.choice input:checked+.choice-content{border-color:var(--purple);background:#a855f718;box-shadow:0 0 0 1px var(--purple)}
.choice-content .choice-icon{font-size:24px;margin-bottom:10px}
.choice-content strong{display:block;margin-bottom:7px;font-size:14px}
.choice-content small{color:var(--muted);font-size:11px;line-height:1.45;display:block}
.setup-step{display:none}
.setup-step.active{display:block}
.step-indicator{color:var(--light);font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:15px}
.setup-footer{display:flex;justify-content:space-between;gap:10px;margin-top:25px;flex-wrap:wrap}
body.compact .card{padding:14px}
body.compact th,body.compact td{padding:9px 8px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}}
@media(max-width:800px){
 .sidebar{position:fixed;z-index:15;left:0;top:0;bottom:0;transform:translateX(-105%);transition:transform .22s;width:265px;box-shadow:15px 0 50px #0005}
 .sidebar.open{transform:translateX(0)}
 .menu-toggle{display:inline-grid;place-items:center}
 .topbar{padding:0 16px;height:68px}
 .content{padding:19px 15px}
 .page-heading{font-size:16px}
 .topbar .page-subtitle{display:none}
 .quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:480px){
 .stats{gap:10px}.card{padding:15px}.stat-value{font-size:23px}
 .choice-grid,.check-grid{grid-template-columns:1fr}
 .setup-card{padding:22px 17px}
 .top-actions{gap:6px}
 .avatar{display:none}
 .bar-row{grid-template-columns:78px 1fr 25px}
}
</style>
</head>
<body>
<div id="app-root"></div>
<div id="modal-root"></div>
<div class="toast-area" id="toast-area" aria-live="polite"></div>

<script>
"use strict";

const STORAGE_KEY = "veltronix_flow_v3";
const SERVICE_OPTIONS = [
  "Criação de sites","Lojas virtuais","Landing pages","Sistemas web",
  "Aplicativos","Design de interfaces","Identidade visual","Automação",
  "Manutenção de sites","Consultoria tecnológica","Marketing digital",
  "Integrações com APIs","Sistemas personalizados","Outros"
];

const DEFAULT_STATE = {
  clients: [],
  quotes: [],
  tickets: [],
  activities: [],
  notifications: [],
  readNotifications: [],
  settings: {
    theme: "purple",
    compact: false,
    confirmDelete: true,
    notify: true,
    onboardingComplete: false,
    profileType: "",
    businessName: "",
    sector: "",
    services: [],
    customServices: ""
  }
};

function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if(!saved) return structuredClone(DEFAULT_STATE);
    return {
      ...structuredClone(DEFAULT_STATE),
      ...saved,
      settings: {...DEFAULT_STATE.settings, ...(saved.settings || {})},
      clients: Array.isArray(saved.clients) ? saved.clients : [],
      quotes: Array.isArray(saved.quotes) ? saved.quotes : [],
      tickets: Array.isArray(saved.tickets) ? saved.tickets : [],
      activities: Array.isArray(saved.activities) ? saved.activities : [],
      notifications: Array.isArray(saved.notifications) ? saved.notifications : [],
      readNotifications: Array.isArray(saved.readNotifications) ? saved.readNotifications : []
    };
  }catch(error){
    console.error("Não foi possível ler os dados locais:", error);
    return structuredClone(DEFAULT_STATE);
  }
}

let db = loadState();
let currentPage = "dashboard";
let searchTerm = "";
let currentFilter = "Todos";
let editing = null;
let setupStep = 1;
let draftSetup = {};
let mobileMenuOpen = false;

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    return true;
  }catch(error){
    console.error(error);
    toast("Não foi possível salvar. Verifique o espaço disponível no navegador.");
    return false;
  }
}

function id(){
  return (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}
function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function money(value){
  return Number(value || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function dateText(value){
  if(!value) return "—";
  const d = new Date(value.length === 10 ? value+"T12:00:00" : value);
  return Number.isNaN(d.getTime()) ? esc(value) : d.toLocaleDateString("pt-BR");
}
function dateTime(value){
  if(!value) return "Agora";
  return new Date(value).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
}
function today(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function toast(message){
  const area = document.getElementById("toast-area");
  if(!area) return;
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = message;
  area.appendChild(el);
  setTimeout(()=>el.remove(),3500);
}
function logActivity(title, detail=""){
  db.activities.unshift({id:id(),title,detail,createdAt:new Date().toISOString()});
  db.activities = db.activities.slice(0,50);
}
function notify(title, message=""){
  if(!db.settings.notify) return;
  db.notifications.unshift({id:id(),title,message,createdAt:new Date().toISOString()});
  db.notifications = db.notifications.slice(0,100);
}
function applySettings(){
  const colors = {
    purple:["#a855f7","#7928ca","#c084fc"],
    blue:["#38bdf8","#2563eb","#93c5fd"],
    green:["#34d399","#059669","#6ee7b7"],
    pink:["#f472b6","#be185d","#f9a8d4"]
  };
  const c = colors[db.settings.theme] || colors.purple;
  document.documentElement.style.setProperty("--purple",c[0]);
  document.documentElement.style.setProperty("--purple2",c[1]);
  document.documentElement.style.setProperty("--light",c[2]);
  document.body.classList.toggle("compact",!!db.settings.compact);
}
function profileName(){
  return db.settings.businessName || "Minha organização";
}
function initials(){
  return profileName().trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase() || "V";
}

const PAGE_META = {
  dashboard:["Dashboard","Visão geral da sua operação"],
  clients:["Clientes","Organize os contatos e relacionamentos"],
  quotes:["Orçamentos","Crie, acompanhe e gerencie propostas"],
  tickets:["Atendimentos","Acompanhe solicitações e tarefas de clientes"],
  ai:["Assistente IA","Área preparada para integração futura"],
  reports:["Relatórios","Resumo dos dados cadastrados neste navegador"],
  notifications:["Notificações","Acompanhe os avisos do sistema"],
  settings:["Configurações","Personalize seu espaço de trabalho"]
};
const NAV_ITEMS = [
  {id:"dashboard",icon:"◫",label:"Dashboard"},
  {id:"clients",icon:"♙",label:"Clientes"},
  {id:"quotes",icon:"▤",label:"Orçamentos"},
  {id:"tickets",icon:"◷",label:"Atendimentos"},
  {id:"ai",icon:"✧",label:"Assistente IA",soon:true},
  {id:"reports",icon:"▥",label:"Relatórios"}
];
const NAV_MORE = [
  {id:"notifications",icon:"♧",label:"Notificações"},
  {id:"settings",icon:"⚙",label:"Configurações"}
];

function navButton(item){
  return `<button type="button" data-page="${item.id}" class="${currentPage===item.id?"active":""}">
    <span class="ico">${item.icon}</span><span>${item.label}</span>
    ${item.soon?'<span class="soon">EM BREVE</span>':""}
    ${item.id==="notifications" && unreadCount()?`<span class="soon">${unreadCount()}</span>`:""}
  </button>`;
}
function renderShell(){
  const meta = PAGE_META[currentPage] || PAGE_META.dashboard;
  document.getElementById("app-root").innerHTML = `
  <div class="app">
    <aside class="sidebar ${mobileMenuOpen?"open":""}" id="sidebar">
      <div class="brand">
        <div class="brand-mark">V</div>
        <div><strong>VELTRONIX FLOW</strong><small>Gestão inteligente</small></div>
      </div>
      <div>
        <div class="nav-title">MENU PRINCIPAL</div>
        <nav class="nav" aria-label="Menu principal">${NAV_ITEMS.map(navButton).join("")}</nav>
      </div>
      <div>
        <div class="nav-title">PREFERÊNCIAS</div>
        <nav class="nav" aria-label="Preferências">${NAV_MORE.map(navButton).join("")}</nav>
      </div>
      <div class="sidebar-bottom">
        <small>ESPAÇO DE TRABALHO</small>
        <strong>${esc(profileName())}</strong>
        <small>${db.settings.profileType==="empresa"?"Perfil empresa":"Perfil profissional"}</small>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="top-left">
          <button class="icon-btn menu-toggle" type="button" data-action="toggle-menu" aria-label="Abrir menu">☰</button>
          <div><div class="page-heading">${esc(meta[0])}</div><div class="page-subtitle">${esc(meta[1])}</div></div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" type="button" data-page="notifications" title="Notificações" aria-label="Notificações">♧${unreadCount()?`<sup style="color:var(--light)">${unreadCount()}</sup>`:""}</button>
          <button class="icon-btn" type="button" data-page="settings" title="Configurações" aria-label="Configurações">⚙</button>
          <div class="avatar" title="${esc(profileName())}">${esc(initials())}</div>
        </div>
      </header>
      <section class="content" id="content"></section>
      <div class="footer">VELTRONIX FLOW · Seus dados permanecem neste navegador nesta versão.</div>
    </main>
  </div>`;
  renderPage();
}
function unreadCount(){
  return db.notifications.filter(n=>!db.readNotifications.includes(n.id)).length;
}
function navigate(page){
  if(!PAGE_META[page]) return;
  currentPage = page;
  searchTerm = "";
  currentFilter = "Todos";
  mobileMenuOpen = false;
  renderShell();
  window.scrollTo({top:0,behavior:"smooth"});
}
function renderPage(){
  const root = document.getElementById("content");
  if(!root) return;
  const pages = {
    dashboard:renderDashboard,
    clients:renderClients,
    quotes:renderQuotes,
    tickets:renderTickets,
    ai:renderAI,
    reports:renderReports,
    notifications:renderNotifications,
    settings:renderSettings
  };
  root.innerHTML = (pages[currentPage] || renderDashboard)();
}

function pageHead(title,desc,button=""){
  return `<div class="page-head"><div><h1>${title}</h1><div class="muted small">${desc}</div></div>${button}</div>`;
}
function statCard(label,value,icon,foot="Atualizado com os dados locais"){
  return `<div class="card"><div class="stat-icon">${icon}</div><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`;
}
function emptyState(icon,title,desc,action=""){
  return `<div class="empty"><div class="empty-icon">${icon}</div><strong>${title}</strong><p>${desc}</p>${action}</div>`;
}
function getQuoteTotal(status){
  return db.quotes.filter(q=>!status || q.status===status).reduce((s,q)=>s+Number(q.value||0),0);
}
function renderDashboard(){
  const pending = db.quotes.filter(q=>["Rascunho","Enviado","Em negociação"].includes(q.status)).length;
  const openTickets = db.tickets.filter(t=>t.status!=="Concluído").length;
  const recent = db.activities.slice(0,6);
  const serviceList = db.settings.services || [];
  return `
  ${pageHead("Visão geral","Acompanhe os principais números da sua operação.",
    `<button class="btn btn-primary" data-action="new-quote">＋ Novo orçamento</button>`)}
  <div class="grid stats">
    ${statCard("Total de clientes",db.clients.length,"♙","Contatos cadastrados")}
    ${statCard("Orçamentos ativos",pending,"▤","Aguardando andamento")}
    ${statCard("Valor aprovado",money(getQuoteTotal("Aprovado")),"↗","Soma dos orçamentos aprovados")}
    ${statCard("Atendimentos abertos",openTickets,"◷","Solicitações não concluídas")}
  </div>
  <div class="grid two-col">
    <div class="card">
      <div class="page-head"><div><h2>Atalhos rápidos</h2><div class="muted small">Acesse as ações mais usadas</div></div></div>
      <div class="grid quick-grid">
        <button class="btn quick" data-action="new-client"><span>♙</span><strong>Novo cliente</strong></button>
        <button class="btn quick" data-action="new-quote"><span>▤</span><strong>Novo orçamento</strong></button>

/* SALVAR FORMULÁRIOS */
document.addEventListener("submit",function(event){
  const form=event.target;
  if(!["client-form","quote-form","ticket-form"].includes(form.id)) return;
  event.preventDefault();
  const data=formObject(form);
  const now=new Date().toISOString();

  if(form.id==="client-form"){
    const old=editing?.type==="client"?db.clients.find(x=>x.id===editing.id):null;
    const item={...(old||{}),id:old?.id||id(),name:data.name.trim(),company:data.company.trim(),email:data.email.trim(),phone:data.phone.trim(),notes:data.notes.trim(),createdAt:old?.createdAt||now,updatedAt:now};
    if(old) db.clients=db.clients.map(x=>x.id===old.id?item:x);
    else db.clients.unshift(item);
    logActivity(old?"Cliente atualizado":"Novo cliente",item.name);
    notify(old?"Cliente atualizado":"Novo cliente cadastrado",item.name);
    saveState();closeModal();renderShell();toast(old?"Cliente atualizado.":"Cliente cadastrado.");
  }

  if(form.id==="quote-form"){
    const old=editing?.type==="quote"?db.quotes.find(x=>x.id===editing.id):null;
    const client=db.clients.find(c=>c.id===data.clientId);
    const item={...(old||{}),id:old?.id||id(),title:data.title.trim(),clientId:data.clientId,clientName:client?.name||"",description:data.description.trim(),value:Number(data.value),dueDate:data.dueDate,status:data.status,createdAt:old?.createdAt||now,updatedAt:now};
    if(old) db.quotes=db.quotes.map(x=>x.id===old.id?item:x);
    else db.quotes.unshift(item);
    logActivity(old?"Orçamento atualizado":"Novo orçamento",item.title);
    notify("Orçamento salvo",`${item.title} · ${money(item.value)}`);
    saveState();closeModal();renderShell();toast(old?"Orçamento atualizado.":"Orçamento cadastrado.");
  }

  if(form.id==="ticket-form"){
    const old=editing?.type==="ticket"?db.tickets.find(x=>x.id===editing.id):null;
    const client=db.clients.find(c=>c.id===data.clientId);
    const item={...(old||{}),id:old?.id||id(),title:data.title.trim(),clientId:data.clientId,clientName:client?.name||"",description:data.description.trim(),priority:data.priority,status:data.status,createdAt:old?.createdAt||now,updatedAt:now};
    if(old) db.tickets=db.tickets.map(x=>x.id===old.id?item:x);
    else db.tickets.unshift(item);
    logActivity(old?"Atendimento atualizado":"Novo atendimento",item.title);
    notify("Atendimento salvo",item.title);
    saveState();closeModal();renderShell();toast(old?"Atendimento atualizado.":"Atendimento cadastrado.");
  }
});

/* EXCLUSÃO E AÇÕES */
function removeRecord(type,recordId){
  const map={client:"clients",quote:"quotes",ticket:"tickets"};
  const key=map[type];
  if(!key) return;
  const item=db[key].find(x=>x.id===recordId);
  if(!item) return;
  if(db.settings.confirmDelete && !confirm(`Deseja realmente excluir "${item.name||item.title}"?`)) return;
  db[key]=db[key].filter(x=>x.id!==recordId);
  if(type==="client"){
    db.quotes=db.quotes.map(q=>q.clientId===recordId?{...q,clientId:"",clientName:""}:q);
    db.tickets=db.tickets.map(t=>t.clientId===recordId?{...t,clientId:"",clientName:""}:t);
  }
  logActivity("Registro excluído",item.name||item.title);
  saveState();renderShell();toast("Registro excluído.");
}
function downloadFile(filename,content,type="text/plain;charset=utf-8"){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvEscape(value){
  let s=String(value??"");
  if(/^[=+\-@]/.test(s)) s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}
function exportCSV(filename,headers,rows){
  const csv=[headers,...rows].map(row=>row.map(csvEscape).join(";")).join("\r\n");
  downloadFile(filename,"\uFEFF"+csv,"text/csv;charset=utf-8");
  toast("Arquivo CSV exportado.");
}
function exportQuotes(){
  exportCSV("veltronix-flow-orcamentos.csv",
    ["Título","Cliente","Descrição","Valor","Prazo","Status","Criado em"],
    db.quotes.map(q=>[q.title,q.clientName,q.description,q.value,q.dueDate,q.status,q.createdAt]));
}
function exportAllCSV(){
  exportCSV("veltronix-flow-resumo.csv",
    ["Tipo","Nome/Título","Cliente/Empresa","Contato/Descrição","Valor","Status","Data"],
    [
      ...db.clients.map(c=>["Cliente",c.name,c.company,c.email+" "+c.phone,"","",""+c.createdAt]),
      ...db.quotes.map(q=>["Orçamento",q.title,q.clientName,q.description,q.value,q.status,q.createdAt]),
      ...db.tickets.map(t=>["Atendimento",t.title,t.clientName,t.description,"",t.status,t.createdAt])
    ]);
}
function backupData(){
  const payload={app:"VELTRONIX FLOW",version:3,exportedAt:new Date().toISOString(),data:db};
  downloadFile("veltronix-flow-backup-"+today()+".json",JSON.stringify(payload,null,2),"application/json;charset=utf-8");
  toast("Backup gerado.");
}
function restoreData(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      const incoming=parsed.data||parsed;
      if(!incoming || !Array.isArray(incoming.clients) || !Array.isArray(incoming.quotes) || !Array.isArray(incoming.tickets)){
        throw new Error("Formato inválido");
      }
      if(!confirm("A restauração substituirá os dados atuais deste navegador. Você já tem um backup dos dados atuais?")) return;
      db={
        ...structuredClone(DEFAULT_STATE),
        ...incoming,
        settings:{...DEFAULT_STATE.settings,...(incoming.settings||{})},
        clients:incoming.clients,
        quotes:incoming.quotes,
        tickets:incoming.tickets,
        activities:Array.isArray(incoming.activities)?incoming.activities:[],
        notifications:Array.isArray(incoming.notifications)?incoming.notifications:[],
        readNotifications:Array.isArray(incoming.readNotifications)?incoming.readNotifications:[]
      };
      saveState();applySettings();renderShell();toast("Backup restaurado.");
    }catch(error){
      console.error(error);toast("Arquivo inválido. Selecione um backup JSON do FLOW.");
    }
  };
  reader.readAsText(file);
}
function saveProfile(){
  const name=document.getElementById("setting-name").value.trim();
  if(!name){toast("Informe o nome da empresa ou profissional.");return;}
  db.settings.profileType=document.getElementById("setting-profile").value;
  db.settings.businessName=name;
  db.settings.sector=document.getElementById("setting-sector").value.trim();
  saveState();renderShell();toast("Perfil atualizado.");
}
function saveServices(){
  const selected=[...document.querySelectorAll('input[name="settings-service"]:checked')].map(x=>x.value);
  const custom=document.getElementById("setting-custom-services").value.trim();
  const extras=custom.split(",").map(x=>x.trim()).filter(Boolean);
  db.settings.services=[...new Set([...selected,...extras])];
  db.settings.customServices=custom;
  saveState();renderShell();toast("Serviços atualizados.");
}
function saveAppearance(){
  db.settings.theme=document.getElementById("setting-theme").value;
  db.settings.compact=document.getElementById("setting-compact").checked;
  db.settings.confirmDelete=document.getElementById("setting-confirm").checked;
  db.settings.notify=document.getElementById("setting-notify").checked;
  saveState();applySettings();renderShell();toast("Aparência e preferências salvas.");
}
function markRead(recordId){
  if(!db.readNotifications.includes(recordId)) db.readNotifications.push(recordId);
  saveState();renderShell();
}

/* CONFIGURAÇÃO INICIAL */
function renderSetup(){
  const s=db.settings;
  draftSetup={
    profileType:s.profileType||"empresa",
    businessName:s.businessName||"",
    sector:s.sector||"",
    services:Array.isArray(s.services)?[...s.services]:[],
    customServices:s.customServices||""
  };
  setupStep=1;
  document.getElementById("app-root").innerHTML=`
    <main class="setup-screen">
      <div class="setup-card">
        <div class="setup-brand"><div class="brand-mark">V</div><div><h1>VELTRONIX FLOW</h1><small class="muted">Gestão inteligente</small></div></div>
        <div class="step-indicator" id="setup-indicator">CONFIGURAÇÃO INICIAL · ETAPA 1 DE 2</div>
        <div class="setup-step active" id="setup-step-1">
          <h2 class="setup-title">Vamos configurar seu espaço de trabalho.</h2>
          <p class="setup-desc">Primeiro, conte como você trabalha. Vamos adaptar o FLOW ao seu perfil.</p>
          <div class="choice-grid">
            <label class="choice"><input type="radio" name="setup-profile" value="empresa" ${draftSetup.profileType==="empresa"?"checked":""}><div class="choice-content"><div class="choice-icon">▦</div><strong>Empresa</strong><small>Para negócios, equipes, lojas e organizações.</small></div></label>
            <label class="choice"><input type="radio" name="setup-profile" value="profissional" ${draftSetup.profileType==="profissional"?"checked":""}><div class="choice-content"><div class="choice-icon">♙</div><strong>Profissional</strong><small>Para freelancers e pessoas que trabalham por conta própria.</small></div></label>
          </div>
          <div class="field"><label for="setup-name">Nome da empresa ou profissional *</label><input class="input" id="setup-name" required value="${esc(draftSetup.businessName)}" placeholder="Como você quer identificar seu espaço?"></div>
          <div class="field"><label for="setup-sector">Segmento de atuação</label><input class="input" id="setup-sector" value="${esc(draftSetup.sector)}" placeholder="Ex.: Tecnologia, design, comércio..."></div>
        </div>
        <div class="setup-step" id="setup-step-2">
          <h2 class="setup-title">Quais serviços você oferece?</h2>
          <p class="setup-desc">Selecione todos os serviços que oferece aos seus clientes. Você poderá editar essa lista depois.</p>
          <div class="check-grid">${SERVICE_OPTIONS.map(service=>`<label class="check-item"><input type="checkbox" name="setup-service" value="${esc(service)}" ${draftSetup.services.includes(service)?"checked":""}>${esc(service)}</label>`).join("")}</div>
          <div class="field" style="margin-top:17px"><label for="setup-custom">Outros serviços (separe por vírgula)</label><input class="input" id="setup-custom" value="${esc(draftSetup.customServices)}" placeholder="Ex.: Suporte técnico, treinamento"></div>
          <div class="notice">Não precisa escolher tudo agora. Você pode atualizar seus serviços em Configurações quando quiser.</div>
        </div>
        <div class="setup-footer">
          <button class="btn" id="setup-back" type="button" data-action="setup-back" disabled>← Voltar</button>
          <button class="btn btn-primary" id="setup-next" type="button" data-action="setup-next">Continuar →</button>
        </div>
        <p class="muted small" style="margin:20px 0 0">Seus dados ficam salvos neste navegador nesta versão. A integração com Supabase será feita depois.</p>
      </div>
    </main>`;
}
function setupNext(){
  if(setupStep===1){
    const name=document.getElementById("setup-name").value.trim();
    if(!name){toast("Informe o nome da empresa ou profissional.");document.getElementById("setup-name").focus();return;}
    draftSetup.profileType=document.querySelector('input[name="setup-profile"]:checked')?.value||"empresa";
    draftSetup.businessName=name;
    draftSetup.sector=document.getElementById("setup-sector").value.trim();
    setupStep=2;
    document.getElementById("setup-step-1").classList.remove("active");
    document.getElementById("setup-step-2").classList.add("active");
    document.getElementById("setup-indicator").textContent="CONFIGURAÇÃO INICIAL · ETAPA 2 DE 2";
    document.getElementById("setup-back").disabled=false;
    document.getElementById("setup-next").textContent="Concluir configuração ✓";
    return;
  }
  draftSetup.services=[...document.querySelectorAll('input[name="setup-service"]:checked')].map(x=>x.value);
  draftSetup.customServices=document.getElementById("setup-custom").value.trim();
  const extras=draftSetup.customServices.split(",").map(x=>x.trim()).filter(Boolean);
  db.settings={
    ...db.settings,
    ...draftSetup,
    services:[...new Set([...draftSetup.services,...extras])],
    onboardingComplete:true
  };
  logActivity("Configuração inicial concluída",profileName());
  notify("Bem-vindo ao VELTRONIX FLOW","Seu espaço de trabalho está pronto.");
  saveState();applySettings();renderShell();toast("Seu espaço de trabalho está pronto!");
}
function setupBack(){
  if(setupStep!==2) return;
  draftSetup.services=[...document.querySelectorAll('input[name="setup-service"]:checked')].map(x=>x.value);
  draftSetup.customServices=document.getElementById("setup-custom").value;
  setupStep=1;
  document.getElementById("setup-step-2").classList.remove("active");
  document.getElementById("setup-step-1").classList.add("active");
  document.getElementById("setup-indicator").textContent="CONFIGURAÇÃO INICIAL · ETAPA 1 DE 2";
  document.getElementById("setup-back").disabled=true;
  document.getElementById("setup-next").textContent="Continuar →";
}

/* EVENTOS CENTRALIZADOS: FUNCIONAM NOS DOIS MENUS */
document.addEventListener("click",function(event){
  const pageEl=event.target.closest("[data-page]");
  if(pageEl){
    event.preventDefault();
    navigate(pageEl.dataset.page);
    return;
  }

  const actionEl=event.target.closest("[data-action]");
  if(!actionEl) return;
  const action=actionEl.dataset.action;
  const recordId=actionEl.dataset.id;

  if(action==="toggle-menu"){
    mobileMenuOpen=!mobileMenuOpen;
    document.getElementById("sidebar")?.classList.toggle("open",mobileMenuOpen);
  }
  if(action==="new-client") showClientForm();
  if(action==="new-quote") showQuoteForm();
  if(action==="new-ticket") showTicketForm();
  if(action==="edit-client") showClientForm(db.clients.find(x=>x.id===recordId));
  if(action==="edit-quote") showQuoteForm(db.quotes.find(x=>x.id===recordId));
  if(action==="edit-ticket") showTicketForm(db.tickets.find(x=>x.id===recordId));
  if(action==="delete-client") removeRecord("client",recordId);
  if(action==="delete-quote") removeRecord("quote",recordId);
  if(action==="delete-ticket") removeRecord("ticket",recordId);
  if(action==="close-modal"){
    if(actionEl.closest("[data-modal-inner]") || actionEl.classList.contains("modal-backdrop")) closeModal();
  }
  if(action==="export-quotes") exportQuotes();
  if(action==="export-all-csv") exportAllCSV();
  if(action==="backup") backupData();
  if(action==="restore") document.getElementById("backup-file")?.click();
  if(action==="save-profile") saveProfile();
  if(action==="save-services") saveServices();
  if(action==="save-appearance") saveAppearance();
  if(action==="mark-read") markRead(recordId);
  if(action==="mark-all-read"){
    db.readNotifications=[...new Set([...db.readNotifications,...db.notifications.map(n=>n.id)])];
    saveState();renderShell();toast("Notificações marcadas como lidas.");
  }
  if(action==="clear-notifications"){
    if(confirm("Deseja limpar todas as notificações?")){
      db.notifications=[];db.readNotifications=[];
      saveState();renderShell();toast("Notificações limpas.");
    }
  }
  if(action==="edit-setup") renderSetup();
  if(action==="setup-next") setupNext();
  if(action==="setup-back") setupBack();
  if(action==="reset-data"){
    if(confirm("Isso apagará clientes, orçamentos, atendimentos e configurações salvos neste navegador. Faça um backup antes. Continuar?")){
      localStorage.removeItem(STORAGE_KEY);
      db=structuredClone(DEFAULT_STATE);
      applySettings();renderSetup();toast("Dados locais apagados.");
    }
  }
});

document.addEventListener("input",function(event){
  if(event.target.matches("[data-search]")){
    searchTerm=event.target.value;
    const pos=event.target.selectionStart;
    renderPage();
    const newSearch=document.querySelector("[data-search]");
    if(newSearch){newSearch.focus();newSearch.setSelectionRange(pos,pos);}
  }
});
document.addEventListener("change",function(event){
  if(event.target.matches("[data-filter]")){
    currentFilter=event.target.value;
    renderPage();
  }
  if(event.target.id==="backup-file"){
    const file=event.target.files?.[0];
    restoreData(file);
    event.target.value="";
  }
});
document.addEventListener("click",function(event){
  if(event.target.classList.contains("modal-backdrop")) closeModal();
});

function init(){
  applySettings();
  if(!db.settings.onboardingComplete || !db.settings.businessName){
    renderSetup();
  }else{
    renderShell();
  }
}
init();
</script>
</body>
</html>
