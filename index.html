
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08080c">
<title>VELTRONIX FLOW | Gestão inteligente</title>
<style>
:root {
  --bg:#08080c;
  --panel:#111117;
  --panel2:#171720;
  --border:#292532;
  --purple:#a855f7;
  --purple2:#7928ca;
  --light:#c084fc;
  --text:#f5f3fa;
  --muted:#9691a5;
  --green:#4ade80;
  --red:#fb7185;
  --yellow:#fbbf24;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--light);outline-offset:2px}
.app{display:flex;min-height:100vh}
.sidebar{width:245px;background:#0d0c12;border-right:1px solid var(--border);padding:24px 15px;position:fixed;inset:0 auto 0 0;z-index:10;display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 9px 26px}
.brand-logo{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,var(--purple),var(--purple2));font-size:21px;font-weight:900;box-shadow:0 0 22px #a855f72b}
.brand strong{display:block;letter-spacing:1px;font-size:14px}
.brand small{display:block;color:var(--light);font-size:10px;letter-spacing:3px;margin-top:5px}
.nav-label{font-size:10px;color:var(--muted);letter-spacing:2px;padding:14px 11px 9px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{background:transparent;border:0;color:var(--muted);text-align:left;border-radius:9px;padding:12px 13px;display:flex;align-items:center;gap:12px}
.nav button:hover,.nav button.active{background:#a855f71b;color:var(--light)}
.nav button.active{box-shadow:inset 3px 0 var(--purple)}
.nav-icon{width:20px;text-align:center;font-size:17px}
.nav .tag{margin-left:auto;font-size:9px;background:#292532;padding:4px 6px;border-radius:5px}
.sidebar-bottom{margin-top:auto;padding-top:24px}
.profile{display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);padding:18px 5px 0}
.avatar{width:36px;height:36px;background:#301b48;border-radius:50%;display:grid;place-items:center;color:var(--light);font-weight:bold}
.profile small{color:var(--muted);display:block;margin-top:4px}
.main{margin-left:245px;width:calc(100% - 245px);min-width:0}
.topbar{height:75px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--border);background:#0c0b11;position:sticky;top:0;z-index:5;gap:15px}
.top-left{display:flex;align-items:center;gap:12px;min-width:0}
.topbar h2{font-size:17px;margin:0}
.topbar p{font-size:11px;color:var(--muted);margin:5px 0 0}
.top-actions{display:flex;align-items:center;gap:9px}
.content{padding:30px;max-width:1600px;margin:auto}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:24px}
h1{font-size:26px;letter-spacing:-.6px;margin:0 0 8px}
.subtitle{color:var(--muted);margin:0;line-height:1.6}
.btn{border:1px solid var(--border);border-radius:9px;padding:10px 14px;background:var(--panel2);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--purple);filter:brightness(1.1)}
.btn.primary{background:linear-gradient(110deg,var(--purple2),var(--purple));border-color:transparent;color:white;font-weight:600}
.btn.danger{color:var(--red)}
.btn.small{padding:7px 10px;font-size:12px}
.icon-btn{width:39px;height:39px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);position:relative}
.dot{position:absolute;right:8px;top:7px;width:7px;height:7px;background:var(--purple);border-radius:50%}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;min-width:0}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stat-label{color:var(--muted);font-size:12px}
.stat-icon{width:37px;height:37px;border-radius:10px;background:#a855f71b;color:var(--light);display:grid;place-items:center;font-size:18px}
.stat-number{font-size:29px;font-weight:750;letter-spacing:-1px;margin:18px 0 8px;overflow-wrap:anywhere}
.stat-foot{font-size:11px;color:var(--muted)}
.stat-foot strong{color:var(--light)}
.columns{grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr)}
.card-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:19px}
.card-title h3{font-size:15px;margin:0}
.card-title p{font-size:11px;color:var(--muted);margin:5px 0 0}
.text-link{background:none;border:0;color:var(--light);font-size:12px}
.empty{text-align:center;padding:32px 12px;color:var(--muted);line-height:1.8}
.empty .big{font-size:30px;margin-bottom:8px}
.activity{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.activity:last-child{border-bottom:0}
.activity-dot{width:9px;height:9px;flex-shrink:0;background:var(--purple);border-radius:50%;margin-top:5px}
.activity p{margin:0;line-height:1.5;overflow-wrap:anywhere}
.activity small{color:var(--muted);display:block;margin-top:5px}
.progress-row{margin:19px 0}
.progress-info{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:9px}
.progress-info span:last-child{color:var(--muted)}
.progress{height:6px;background:#282431;border-radius:9px;overflow:hidden}
.progress div{height:100%;background:linear-gradient(90deg,var(--purple2),var(--light));border-radius:9px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:17px}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;padding-left:37px}
.search:before{content:"⌕";position:absolute;left:13px;top:7px;font-size:23px;color:var(--muted)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:11px 12px;border-radius:8px;min-width:0}
input::placeholder,textarea::placeholder{color:#6f6a7b}
select option{background:var(--panel)}
textarea{resize:vertical;min-height:85px}
.table-wrap{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{text-align:left;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1px;padding:13px 12px;border-bottom:1px solid var(--border)}
td{padding:15px 12px;border-bottom:1px solid #25222d;font-size:12px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#ffffff04}
.person{display:flex;align-items:center;gap:10px}
.mini-avatar{width:32px;height:32px;border-radius:9px;background:#301b48;color:var(--light);display:grid;place-items:center;font-weight:bold}
.muted{color:var(--muted)}
.badge{display:inline-flex;align-items:center;border-radius:6px;padding:5px 8px;font-size:10px;background:#a855f71b;color:var(--light);white-space:nowrap}
.badge.green{background:#4ade8017;color:var(--green)}
.badge.red{background:#fb718517;color:var(--red)}
.badge.yellow{background:#fbbf2417;color:var(--yellow)}
.row-actions{display:flex;gap:5px}
.row-actions button{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:6px 8px}
.row-actions button:hover{color:var(--light);border-color:var(--purple)}
.amount{font-weight:700}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label{font-size:12px;color:#c5bfd1}
.field.full{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:23px}
.section-note{border:1px solid #a855f744;background:#a855f70b;padding:14px;border-radius:10px;color:#cbb4e7;line-height:1.6;font-size:12px;margin-bottom:18px}
.settings-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border:0}
.setting-row p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
.switch{width:42px;height:24px;position:relative;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:20px;background:#393441;cursor:pointer}
.switch span:before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;background:white;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--purple)}
.switch input:checked+span:before{transform:translateX(18px)}
.theme-options{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}
.theme-swatch{border:2px solid transparent;border-radius:12px;padding:8px;background:#171720;color:white;min-width:100px}
.theme-swatch.active{border-color:var(--light)}
.swatch-color{height:35px;border-radius:6px;margin-bottom:8px}
.notice-list{display:grid;gap:10px}
.notice{padding:14px;border:1px solid var(--border);border-radius:10px;display:flex;gap:12px;align-items:flex-start}
.notice p{margin:0;line-height:1.5}
.notice small{display:block;color:var(--muted);margin-top:6px}
.chart{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:20px}
.chart-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px}
.chart-bar{width:min(42px,90%);min-height:3px;background:linear-gradient(0deg,var(--purple2),var(--light));border-radius:6px 6px 2px 2px}
.chart-label{font-size:10px;color:var(--muted)}
.chart-value{font-size:10px;color:var(--light)}
.kpi{font-size:25px;font-weight:bold;margin:8px 0}
.overlay{position:fixed;inset:0;background:#000b;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal{width:min(650px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}
.modal-head h3{font-size:19px;margin:0}
.close{background:none;border:0;color:var(--muted);font-size:25px}
.toast-stack{position:fixed;right:20px;bottom:20px;z-index:50;display:grid;gap:9px;width:min(360px,calc(100vw - 40px))}
.toast{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--purple);padding:14px;border-radius:10px;box-shadow:0 10px 35px #0008;line-height:1.5;animation:slide .2s ease}
.toast.error{border-left-color:var(--red)}
.toast.success{border-left-color:var(--green)}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.menu-toggle{display:none}
.footer-note{font-size:11px;color:var(--muted);text-align:center;padding:24px 0 4px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:23px}.topbar{padding:0 22px}}
@media(max-width:760px){
 .sidebar{transform:translateX(-100%);transition:transform .25s;width:260px;box-shadow:none}
 .sidebar.open{transform:translateX(0);box-shadow:20px 0 60px #0009}
 .main{margin-left:0;width:100%}
 .topbar{height:68px;padding:0 15px}
 .menu-toggle{display:inline-block}
 .content{padding:20px 14px}
 .page-head{flex-direction:column;align-items:stretch}
 .page-head>.btn{align-self:flex-start}
 .columns,.settings-grid{grid-template-columns:1fr}
 .stats{gap:10px}
 .card{padding:15px}
 .stat-number{font-size:24px}
 .topbar p{display:none}
 .form-grid{grid-template-columns:1fr}
 .field.full{grid-column:auto}
 .modal{padding:18px}
 .top-actions .hide-mobile{display:none}
}
@media(max-width:390px){.stats{grid-template-columns:1fr}.topbar h2{font-size:14px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-logo">V</div>
    <div><strong>VELTRONIX</strong><small>F L O W</small></div>
  </div>
  <div class="nav-label">MENU PRINCIPAL</div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="nav-icon">◫</span>Dashboard</button>
    <button data-page="clientes"><span class="nav-icon">♙</span>Clientes</button>
    <button data-page="orcamentos"><span class="nav-icon">▤</span>Orçamentos</button>
    <button data-page="atendimentos"><span class="nav-icon">◉</span>Atendimentos</button>
    <button data-page="assistente"><span class="nav-icon">✧</span>Assistente IA <span class="tag">EM BREVE</span></button>
    <button data-page="relatorios"><span class="nav-icon">▥</span>Relatórios</button>
  </nav>
  <div class="nav-label">SISTEMA</div>
  <nav class="nav">
    <button data-page="notificacoes"><span class="nav-icon">♧</span>Notificações <span id="nav-badge" class="tag" hidden>0</span></button>
    <button data-page="configuracoes"><span class="nav-icon">⚙</span>Configurações</button>
  </nav>
  <div class="sidebar-bottom">
    <div class="profile">
      <div class="avatar">VF</div>
      <div><strong>Administrador</strong><small>Ambiente local</small></div>
    </div>
  </div>
</aside>

<main class="main">
<header class="topbar">
  <div class="top-left">
    <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Abrir menu">☰</button>
    <div><h2 id="top-title">Dashboard</h2><p id="top-subtitle">Visão geral da sua operação</p></div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="top-notifications" aria-label="Notificações">♧<span id="top-dot" class="dot" hidden></span></button>
    <button class="btn primary hide-mobile" id="quick-quote">＋ Novo orçamento</button>
  </div>
</header>
<div class="content" id="content"></div>
</main>
</div>
<div id="modal-root"></div>
<div id="toast-stack" class="toast-stack" aria-live="polite"></div>

<script>
(function(){
"use strict";

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const STORE = "veltronix_flow_v3";
const pageInfo = {
 dashboard:["Dashboard","Visão geral da sua operação"],
 clientes:["Clientes","Gerencie seus relacionamentos comerciais"],
 orcamentos:["Orçamentos","Organize propostas e oportunidades"],
 atendimentos:["Atendimentos","Acompanhe solicitações e tarefas"],
 assistente:["Assistente IA","Central de assistência inteligente"],
 relatorios:["Relatórios","Acompanhe os dados da sua operação"],
 notificacoes:["Notificações","Avisos e atividades recentes"],
 configuracoes:["Configurações","Personalize sua experiência"]
};
const initial = {
 clients:[], quotes:[], tickets:[], activities:[], notifications:[],
 settings:{theme:"purple",compact:false,confirmDelete:true,notify:true},
 readNotifications:0
};
let db = load();
let currentPage = "dashboard";
let modalReturnPage = null;

function load(){
 try{
  const raw=localStorage.getItem(STORE);
  if(!raw)return structuredClone(initial);
  const saved=JSON.parse(raw);
  return {...structuredClone(initial),...saved,
   clients:Array.isArray(saved.clients)?saved.clients:[],
   quotes:Array.isArray(saved.quotes)?saved.quotes:[],
   tickets:Array.isArray(saved.tickets)?saved.tickets:[],
   activities:Array.isArray(saved.activities)?saved.activities:[],
   notifications:Array.isArray(saved.notifications)?saved.notifications:[],
   settings:{...initial.settings,...saved.settings}};
 }catch(e){return structuredClone(initial)}
}
function save(){
 try{
  localStorage.setItem(STORE,JSON.stringify(db));
  return true;
 }catch(e){
  toast("Não foi possível salvar os dados. Verifique o armazenamento do navegador.","error");
  return false;
 }
}
function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function money(n){
 return Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function dateNow(){return new Date().toISOString()}
function dateBR(v){
 if(!v)return "—";
 const d=new Date(v.length===10?v+"T12:00:00":v);
 return isNaN(d)?"—":d.toLocaleDateString("pt-BR");
}
function shortDate(v){
 if(!v)return "";
 const d=new Date(v);
 return isNaN(d)?"":d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function initials(s){
 return String(s||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();
}
function toast(message,type="success"){
 const el=document.createElement("div");
 el.className="toast "+type;
 el.textContent=message;
 $("#toast-stack").append(el);
 setTimeout(()=>el.remove(),3600);
}
function logActivity(message){
 db.activities.unshift({id:id(),message,at:dateNow()});
 db.activities=db.activities.slice(0,60);
}
function notify(title,message){
 if(db.settings.notify){
  db.notifications.unshift({id:id(),title,message,at:dateNow(),read:false});
  db.notifications=db.notifications.slice(0,80);
 }
}
function commit(message,notice=true){
 logActivity(message);
 if(notice)notify("Atualização",message);
 save();
 render();
}
function confirmAction(message){
 return !db.settings.confirmDelete||window.confirm(message);
}
function statusBadge(status){
 const map={
  "Novo":"yellow","Em negociação":"", "Aprovado":"green",
  "Recusado":"red","Concluído":"green","Pendente":"yellow",
  "Em andamento":"","Aguardando":"yellow","Resolvido":"green",
  "Cancelado":"red","Enviado":""
 };
 return `<span class="badge ${map[status]||""}">${esc(status||"—")}</span>`;
}
function clientName(clientId){
 return db.clients.find(c=>c.id===clientId)?.name||"Cliente removido";
}
function pageHead(title,subtitle,button=""){
 return `<div class="page-head"><div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div>${button}</div>`;
}
function stat(label,value,icon,foot){
 return `<div class="card"><div class="stat-top"><span class="stat-label">${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-number">${value}</div><div class="stat-foot">${foot}</div></div>`;
}
function empty(icon,title,description,button=""){
 return `<div class="empty"><div class="big">${icon}</div><strong>${title}</strong><div>${description}</div>${button?`<div style="margin-top:17px">${button}</div>`:""}</div>`;
}
function btn(label,action,kind=""){
 return `<button class="btn ${kind}" data-action="${action}">${label}</button>`;
}
function cardTitle(title,subtitle="",action="",label="Ver todos"){
 return `<div class="card-title"><div><h3>${title}</h3>${subtitle?`<p>${subtitle}</p>`:""}</div>${action?`<button class="text-link" data-action="${action}">${label} →</button>`:""}</div>`;
}
function moneyTotalQuotes(){
 return db.quotes.filter(q=>!["Recusado","Cancelado"].includes(q.status)).reduce((s,q)=>s+Number(q.value||0),0);
}
function approvedTotal(){
 return db.quotes.filter(q=>["Aprovado","Concluído"].includes(q.status)).reduce((s,q)=>s+Number(q.value||0),0);
}
function renderDashboard(){
 const recent=db.activities.slice(0,6);
 const latest=db.quotes.slice(0,5);
 const openTickets=db.tickets.filter(t=>!["Resolvido","Cancelado"].includes(t.status)).length;
 const recentActivity=recent.length?recent.map(a=>`<div class="activity"><div class="activity-dot"></div><div><p>${esc(a.message)}</p><small>${new Date(a.at).toLocaleString("pt-BR")}</small></div></div>`).join(""):empty("◷","Nenhuma atividade ainda","As suas ações aparecerão aqui.");
 const latestQuotes=latest.length?`<div class="table-wrap"><table><thead><tr><th>ORÇAMENTO</th><th>CLIENTE</th><th>VALOR</th><th>STATUS</th></tr></thead><tbody>${latest.map(q=>`<tr><td><strong>${esc(q.code)}</strong></td><td>${esc(clientName(q.clientId))}</td><td class="amount">${money(q.value)}</td><td>${statusBadge(q.status)}</td></tr>`).join("")}</tbody></table></div>`:empty("▤","Nenhum orçamento","Crie o primeiro orçamento para começar.",btn("＋ Criar orçamento","new-quote","primary"));
 const statuses=["Novo","Em negociação","Aprovado","Recusado","Concluído"];
 const bars=statuses.map(s=>{
  const n=db.quotes.filter(q=>q.status===s).length;
  const pct=db.quotes.length?Math.round(n/db.quotes.length*100):0;
  return `<div class="progress-row"><div class="progress-info"><span>${s}</span><span>${n} (${pct}%)</span></div><div class="progress"><div style="width:${pct}%"></div></div></div>`;
 }).join("");
 return `${pageHead("Visão geral","Acompanhe os principais números do VELTRONIX FLOW.",btn("＋ Novo cliente","new-client")+" "+btn("＋ Novo orçamento","new-quote","primary"))}
 <div class="grid stats">
 ${stat("Total de clientes",db.clients.length,"♙","Clientes cadastrados")}
 ${stat("Orçamentos",db.quotes.length,"▤","Propostas registradas")}
 ${stat("Valor em propostas",money(moneyTotalQuotes()),"R$","Exceto recusadas e canceladas")}
 ${stat("Atendimentos abertos",openTickets,"◉","Solicitações não resolvidas")}
 </div>
 <div class="grid columns">
  <div class="card">${cardTitle("Orçamentos recentes","Últimas propostas criadas","orcamentos")} ${latestQuotes}</div>

function renderReports(){

function openPage(p){

function modal(title,body){
 modalReturnPage=currentPage;
 $("#modal-root").innerHTML=`<div class="overlay" id="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h3>${title}</h3><button class="close" data-action="close-modal" aria-label="Fechar">×</button></div>${body}</div></div>`;
 $("#modal-overlay").addEventListener("click",e=>{if(e.target.id==="modal-overlay")closeModal()});
 const first=$("#modal-root input:not([type=hidden]),#modal-root select,#modal-root textarea");
 if(first)first.focus();
}
function closeModal(){$("#modal-root").innerHTML=""}
function field(label,name,opts={}){
 const {value="",type="text",placeholder="",required=false,full=false,options=null,step=null,min=null}=opts;
 let input;
 if(options){
  input=`<select name="${name}" ${required?"required":""}>${options.map(o=>`<option value="${esc(o.value??o)}" ${String(o.value??o)===String(value)?"selected":""}>${esc(o.label??o)}</option>`).join("")}</select>`;
 }else if(type==="textarea"){
  input=`<textarea name="${name}" placeholder="${esc(placeholder)}" ${required?"required":""}>${esc(value)}</textarea>`;
 }else{
  input=`<input name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${required?"required":""} ${step?`step="${step}"`:""} ${min!==null?`min="${min}"`:""}>`;
 }
 return `<div class="field ${full?"full":""}"><label>${label}${required?" *":""}</label>${input}</div>`;
}
function formModal(title,fields,values,onSubmit,submitLabel="Salvar"){
 modal(title,`<form id="entity-form"><div class="form-grid">${fields(values)}</div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button type="submit" class="btn primary">${submitLabel}</button></div></form>`);
 $("#entity-form").addEventListener("submit",e=>{
  e.preventDefault();
  const fd=new FormData(e.currentTarget);
  const data=Object.fromEntries(fd.entries());
  onSubmit(data);
 });
}
function clientFields(c){
 return field("Nome completo","name",{value:c.name||"",required:true,placeholder:"Nome do cliente"})+
 field("Empresa","company",{value:c.company||"",placeholder:"Nome da empresa"})+
 field("E-mail","email",{type:"email",value:c.email||"",placeholder:"email@exemplo.com"})+
 field("Telefone","phone",{value:c.phone||"",placeholder:"(21) 99999-9999"})+
 field("Observações","notes",{type:"textarea",value:c.notes||"",full:true,placeholder:"Informações adicionais"});
}
function openClientForm(existing=null){
 const c=existing||{};
 formModal(existing?"Editar cliente":"Novo cliente",clientFields,c,data=>{
  const name=data.name.trim();
  if(!name){toast("Informe o nome do cliente.","error");return}
  if(existing)Object.assign(existing,data,{name});
  else db.clients.unshift({id:id(),...data,name,createdAt:dateNow()});
  closeModal();
  commit(existing?"Cliente atualizado":"Cliente cadastrado");
 });
}
function quoteFields(q){
 const clients=db.clients.map(c=>({value:c.id,label:c.name}));
 const clientOptions=[{value:"",label:"Selecione um cliente"},...clients];
 const statuses=["Novo","Em negociação","Aprovado","Recusado","Concluído"];
 return field("Cliente","clientId",{value:q.clientId||"",options:clientOptions,required:true})+
 field("Valor (R$)","value",{type:"number",value:q.value??"",required:true,step:"0.01",min:0,placeholder:"0,00"})+
 field("Data","date",{type:"date",value:q.date||new Date().toISOString().slice(0,10),required:true})+
 field("Status","status",{value:q.status||"Novo",options:statuses})+
 field("Descrição da proposta","description",{value:q.description||"",type:"textarea",full:true,placeholder:"Descreva o serviço ou produto proposto"});
}
function openQuoteForm(existing=null){
 if(!db.clients.length){
  toast("Cadastre um cliente antes de criar um orçamento.","error");
  openClientForm();
  return;
 }
 const q=existing||{};
 formModal(existing?"Editar orçamento":"Novo orçamento",quoteFields,q,data=>{
  if(!db.clients.some(c=>c.id===data.clientId)){toast("Selecione um cliente válido.","error");return}
  const value=Number(data.value);
  if(!Number.isFinite(value)||value<0){toast("Informe um valor válido.","error");return}
  const extra={...data,value};
  if(existing)Object.assign(existing,extra);
  else{
   const seq=db.quotes.length+1;
   extra.id=id();
   extra.code="ORC-"+new Date().getFullYear()+"-"+String(seq).padStart(4,"0");
   extra.createdAt=dateNow();
   db.quotes.unshift(extra);
  }
  closeModal();
  commit(existing?"Orçamento atualizado":"Orçamento criado");
 });
}
function ticketFields(t){
 const clients=[{value:"",label:"Sem cliente vinculado"},...db.clients.map(c=>({value:c.id,label:c.name}))];
 return field("Título","title",{value:t.title||"",required:true,placeholder:"Ex.: Atualizar site"})+
 field("Cliente","clientId",{value:t.clientId||"",options:clients})+
 field("Status","status",{value:t.status||"Pendente",options:["Pendente","Em andamento","Aguardando","Resolvido","Cancelado"]})+
 field("Prioridade","priority",{value:t.priority||"Média",options:["Baixa","Média","Alta"]})+
 field("Data","date",{type:"date",value:t.date||new Date().toISOString().slice(0,10),required:true})+
 field("Descrição","description",{value:t.description||"",type:"textarea",full:true,placeholder:"Detalhes do atendimento"});
}
function openTicketForm(existing=null){

 formModal(existing?"Editar atendimento":"Novo atendimento",ticketFields,t,data=>{
  if(data.clientId&&!db.clients.some(c=>c.id===data.clientId)){toast("Cliente inválido.","error");return}
  if(existing)Object.assign(existing,data);
  else db.tickets.unshift({id:id(),...data,createdAt:dateNow()});
  closeModal();
  commit(existing?"Atendimento atualizado":"Atendimento registrado");
 });
}
function findById(list,idValue){return list.find(x=>x.id===idValue)}
function removeRecord(list,idValue,label){
 const item=findById(list,idValue);
 if(!item)return;
 if(!confirmAction(`Deseja realmente excluir ${label}? Essa ação não pode ser desfeita.`))return;
 const i=list.indexOf(item);
 list.splice(i,1);
 commit(`${label.charAt(0).toUpperCase()+label.slice(1)} excluído`);
}
function downloadFile(name,content,type){
 const blob=new Blob([content],{type});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportCSV(){
 const records=[
  ["Clientes",db.clients],
  ["Orçamentos",db.quotes],
  ["Atendimentos",db.tickets]
 ];
 const lines=[];
 records.forEach(([label,items])=>{
  lines.push(label);
  if(!items.length){lines.push("Sem registros","");return}
  const keys=[...new Set(items.flatMap(o=>Object.keys(o)))];
  lines.push(keys.map(k=>`"${k.replace(/"/g,'""')}"`).join(";"));
  items.forEach(o=>lines.push(keys.map(k=>`"${String(o[k]??"").replace(/"/g,'""')}"`).join(";")));
  lines.push("");
 });
 downloadFile("veltronix-flow-relatorios.csv","\uFEFF"+lines.join("\r\n"),"text/csv;charset=utf-8");
 toast("Relatório CSV exportado.");
}
function backup(){
 downloadFile("veltronix-flow-backup.json",JSON.stringify({version:3,exportedAt:dateNow(),data:db},null,2),"application/json");
 toast("Backup exportado.");
}
function importBackup(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const parsed=JSON.parse(reader.result);
   const d=parsed.data||parsed;
   if(!d||!Array.isArray(d.clients)||!Array.isArray(d.quotes)||!Array.isArray(d.tickets))throw new Error("Formato inválido");
   if(!confirmAction("Importar este backup substituirá os dados atuais deste navegador. Continuar?"))return;
   db={...structuredClone(initial),...d,settings:{...initial.settings,...d.settings}};
   save();closeModal();openPage("dashboard");toast("Backup importado com sucesso.");
  }catch(e){toast("Arquivo inválido. Selecione um backup JSON do VELTRONIX FLOW.","error")}
 };
 reader.readAsText(file);
}
function readAll(){
 db.notifications.forEach(n=>n.read=true);
 db.readNotifications=db.notifications.length;
 save();render();toast("Notificações marcadas como lidas.");
}
function exportCsvWithCurrent(){
 if(currentPage==="relatorios")exportCSV();
}
function action(actionName,el){
 const recordId=el?.dataset.id;
 switch(actionName){
 case "dashboard":case "clientes":case "orcamentos":case "atendimentos":case "assistente":case "relatorios":case "notificacoes":case "configuracoes":openPage(actionName);break;
 case "new-client":openClientForm();break;
 case "new-quote":openQuoteForm();break;
 case "new-ticket":openTicketForm();break;
 case "edit-client":{const c=findById(db.clients,recordId);if(c)openClientForm(c);break}
 case "edit-quote":{const q=findById(db.quotes,recordId);if(q)openQuoteForm(q);break}
 case "edit-ticket":{const t=findById(db.tickets,recordId);if(t)openTicketForm(t);break}
 case "delete-client":{
  const c=findById(db.clients,recordId);if(!c)break;
  const related=db.quotes.filter(q=>q.clientId===recordId).length+db.tickets.filter(t=>t.clientId===recordId).length;
  if(related&&!confirmAction(`Este cliente possui ${related} orçamento(s)/atendimento(s) relacionado(s). Excluir o cliente? Os registros relacionados serão mantidos, mas ficarão sem nome de cliente.`))break;
  if(!related&&!confirmAction("Excluir este cliente?"))break;
  db.clients=db.clients.filter(x=>x.id!==recordId);commit("Cliente excluído");break;
 }
 case "delete-quote":removeRecord(db.quotes,recordId,"orçamento");break;
 case "delete-ticket":removeRecord(db.tickets,recordId,"atendimento");break;
 case "close-modal":closeModal();break;
 case "assistant-info":toast("A integração de IA será adicionada em uma etapa futura.");break;
 case "read-all":readAll();break;
 case "read-notice":{const n=findById(db.notifications,recordId);if(n){n.read=true;save();render()}break}
 case "clear-notifications":
  if(confirmAction("Apagar todas as notificações?")){db.notifications=[];save();render();toast("Notificações apagadas.")}break;
 case "export-csv":exportCSV();break;
 case "backup":backup();break;
 case "restore-prompt":$("#backup-file").click();break;
 case "reset-settings":
  if(confirmAction("Restaurar as configurações padrão?")){db.settings={...initial.settings};save();render();toast("Configurações restauradas.")}break;
 case "reset-data":
  if(confirmAction("ATENÇÃO: apagar todos os clientes, orçamentos, atendimentos, atividades e notificações deste navegador? Exporte um backup antes se precisar dos dados.")){
   const settings={...db.settings};db=structuredClone(initial);db.settings=settings;save();openPage("dashboard");toast("Dados locais apagados.");
  }break;
 case "theme":
  db.settings.theme=el.dataset.theme;save();render();toast("Tema atualizado.");break;
 default:break;
 }
}
$("#nav").addEventListener("click",e=>{
 const b=e.target.closest("[data-page]");
 if(b)openPage(b.dataset.page);
});
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-action]");
 if(b){action(b.dataset.action,b);return}
 if(e.target.closest("#quick-quote")){openQuoteForm();return}
 if(e.target.closest("#top-notifications")){openPage("notificacoes");return}
 if(e.target.closest("#menu-toggle")){$("#sidebar").classList.toggle("open");return}
});
$("#content").addEventListener("input",e=>{
 if(e.target.id!=="table-search")return;
 filterTable();
});
$("#content").addEventListener("change",e=>{
 if(e.target.id==="table-filter")filterTable();
 if(e.target.dataset.setting){
  db.settings[e.target.dataset.setting]=e.target.checked;
  save();render();toast("Preferência atualizada.");
 }
});
function filterTable(){
 const query=($("#table-search")?.value||"").toLowerCase().trim();
 const status=$("#table-filter")?.value||"";
 const rows=$$("#data-table tbody tr");
 let visible=0;
 rows.forEach(row=>{
  const matchesQuery=(row.dataset.search||"").includes(query);
  const matchesStatus=!status||row.dataset.status===status;
  const show=matchesQuery&&matchesStatus;
  row.hidden=!show;
  if(show)visible++;
 });
 const emptyEl=$("#no-results");
 if(emptyEl)emptyEl.hidden=visible>0;
}
$("#content").addEventListener("change",e=>{
 if(e.target.id==="backup-file"&&e.target.files[0])importBackup(e.target.files[0]);
});
$("#modal-root").addEventListener("change",e=>{
 if(e.target.id==="backup-file"&&e.target.files[0])importBackup(e.target.files[0]);
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){closeModal();$("#sidebar").classList.remove("open")}
});
window.addEventListener("storage",e=>{
 if(e.key===STORE){db=load();render()}
});
render();
})();
</script>
</body>
</html>
